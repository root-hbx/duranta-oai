# NR NTN: one UE and two (or three) gNBs on a trace-driven LEO satellite (SAT_LEO_TRANS), against an external Open5GS 5GC.
# Binaries come from a mounted build directory; see ntn.sh and doc/trace-based-ntn-tutorial.md.
# Calibration (tools/ntn/calc_ntn_parameters.py) for the sample trace, UE = gNB at the mid-pass subpoint, fc 2488.4 MHz.
# SR prohibit 32 ms (above the SR to grant round trip) and 32 SRs at most instead of the GEO 512 ms x 64: a UE the gNB
# no longer serves (e.g., lost handover command) gives up on SR and starts a random access after about 1 s, not 33 s.
# Xn: gNB2 sets up Xn with gNB1 when it starts, gNB1 only listens (the SCTP connect blocks the SCTP task, NGAP included,
# as long as the peer does not exist).
# PRACH root sequences 1, 40 and 80 (16 roots each for 64 preambles at Ncs 34): with a shared root, the co-channel neighbour
# also detects the UE preambles and its RARs collide with the serving cell ones.
x-oai: &oai
  image: ${OAI_IMG:-ntn-dev}
  privileged: true
  volumes:
    - ../../..:/oai-ran:ro
    - ${BUILD_DIR:-../../../build}:/build
  environment: &env
    CONF: /oai-ran/ci-scripts/conf_files
    LOG: --log_config.global_log_options level,nocolor,time --telnetsrv --telnetsrv.listenaddr 127.0.0.1 --telnetsrv.shrmod ci
    OPT: ${OPT:-}
    PROP_DELAY: --rfsimulator.[0].prop_delay ${PROP_DELAY:-8}
    CHAN: >-
      --channelmod.modellist_rfsimu_1.[0].type ${SAT:-SAT_LEO_TRANS}
      --channelmod.modellist_rfsimu_1.[0].pos_ue_x -3310204.0 --channelmod.modellist_rfsimu_1.[0].pos_ue_y -5006785.1
      --channelmod.modellist_rfsimu_1.[0].pos_ue_z 2157610.7 --channelmod.modellist_rfsimu_1.[0].pos_gnb_x -3310204.0
      --channelmod.modellist_rfsimu_1.[0].pos_gnb_y -5006785.1 --channelmod.modellist_rfsimu_1.[0].pos_gnb_z 2157610.7
      --channelmod.modellist_rfsimu_1.[1].type ${SAT:-SAT_LEO_TRANS} --channelmod.modellist_rfsimu_1.[1].sat_trace_file /oai-ran/tools/ntn/data/${SAT_TRACE1:-orbital_trace_s_300.csv}
      --channelmod.modellist_rfsimu_1.[1].pos_ue_x -3310204.0 --channelmod.modellist_rfsimu_1.[1].pos_ue_y -5006785.1
      --channelmod.modellist_rfsimu_1.[1].pos_ue_z 2157610.7 --channelmod.modellist_rfsimu_1.[1].pos_gnb_x -3310204.0
      --channelmod.modellist_rfsimu_1.[1].pos_gnb_y -5006785.1 --channelmod.modellist_rfsimu_1.[1].pos_gnb_z 2157610.7
      --channelmod.modellist_rfsimu_1.[2].model_name rfsimu_channel_ue1 
      --channelmod.modellist_rfsimu_1.[2].noise_power_dB -100
      --channelmod.modellist_rfsimu_1.[2].type ${SAT:-SAT_LEO_TRANS} --channelmod.modellist_rfsimu_1.[2].sat_trace_file /oai-ran/tools/ntn/data/${SAT_TRACE2:-orbital_trace_s_300.csv}
      --channelmod.modellist_rfsimu_1.[2].pos_ue_x -3310204.0 --channelmod.modellist_rfsimu_1.[2].pos_ue_y -5006785.1
      --channelmod.modellist_rfsimu_1.[2].pos_ue_z 2157610.7 --channelmod.modellist_rfsimu_1.[2].pos_gnb_x -3310204.0
      --channelmod.modellist_rfsimu_1.[2].pos_gnb_y -5006785.1 --channelmod.modellist_rfsimu_1.[2].pos_gnb_z 2157610.7
      --channelmod.modellist_rfsimu_1.[3].model_name rfsimu_channel_ue2
      --channelmod.modellist_rfsimu_1.[3].noise_power_dB -100
      --channelmod.modellist_rfsimu_1.[3].type ${SAT:-SAT_LEO_TRANS} --channelmod.modellist_rfsimu_1.[3].sat_trace_file /oai-ran/tools/ntn/data/${SAT_TRACE3:-orbital_trace_s_300.csv}
      --channelmod.modellist_rfsimu_1.[3].pos_ue_x -3310204.0 --channelmod.modellist_rfsimu_1.[3].pos_ue_y -5006785.1
      --channelmod.modellist_rfsimu_1.[3].pos_ue_z 2157610.7 --channelmod.modellist_rfsimu_1.[3].pos_gnb_x -3310204.0
      --channelmod.modellist_rfsimu_1.[3].pos_gnb_y -5006785.1 --channelmod.modellist_rfsimu_1.[3].pos_gnb_z 2157610.7
      ${SAT_CLOCK:-}

x-gnb: &gnb
  <<: *oai
  command:
    - bash
    - -c
    - >-
      exec /build/nr-softmodem -O $$CONF/gnb.sa.band254.u0.25prb.rfsim.ntn-leo.conf --rfsim
      --rfsimulator.[0].serveraddr $$RFSIM $$PROP_DELAY $$CHAN --channelmod.modellist_rfsimu_1.[0].sat_trace_file $$TRACE0
      --gNBs.[0].gNB_ID $$GNB_ID --gNBs.[0].nr_cellid $$CELL --gNBs.[0].servingCellConfigCommon.[0].physCellId $$PCI
      --gNBs.[0].servingCellConfigCommon.[0].ssb_PositionsInBurst_Bitmap $$SSB
      --gNBs.[0].servingCellConfigCommon.[0].prach_RootSequenceIndex $$ROOT
      --gNBs.[0].plmn_list.[0].mcc 1 --gNBs.[0].plmn_list.[0].mnc 1 --gNBs.[0].amf_ip_address.[0].ipv4 172.22.0.10
      --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF $$IP --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU $$IP
      --gNBs.[0].servingCellConfigCommon.[0].ta-Common-r17 ${TA_COMMON:-1865301}
      --gNBs.[0].servingCellConfigCommon.[0].ta-CommonDrift-r17 ${TA_DRIFT:--227522}
      --gNBs.[0].servingCellConfigCommon.[0].cellSpecificKoffset_r17 ${KOFFSET:-20}
      --gNBs.[0].servingCellConfigCommon.[0].ntn-UlSyncValidityDuration-r17 ${NTN_VALIDITY:-5}
      --gNBs.[0].TIMERS.sr_ProhibitTimer 32 --gNBs.[0].TIMERS.sr_TransMax 32 --gNBs.[0].TIMERS.sr_ProhibitTimer_v1700 0
      --gNBs.[0].servingCellConfigCommon.[0].positionX-r17 -3204120
      --gNBs.[0].servingCellConfigCommon.[0].positionY-r17 -3925660
      --gNBs.[0].servingCellConfigCommon.[0].positionZ-r17 1086297
      --gNBs.[0].servingCellConfigCommon.[0].velocityVX-r17 68227
      --gNBs.[0].servingCellConfigCommon.[0].velocityVY-r17 -28078
      --gNBs.[0].servingCellConfigCommon.[0].velocityVZ-r17 99057
      --gNBs.[0].neighbour_list.[0].nr_cellid $$CELL $$(j=0; for n in $$NEIGHBOURS; do IFS=/ read id cell pci <<< $$n;
      for k in gNB_ID:$$id nr_cellid:$$cell physical_cellId:$$pci absoluteFrequencySSB:497770 subcarrierSpacing:0 band:254
      tracking_area_code:1 plmn.mcc:1 plmn.mnc:1 plmn.mnc_length:2;
      do echo --gNBs.[0].neighbour_list.[0].neighbour_cell_configuration.[$$j].$${k%%:*} $${k#*:}; done; j=$$((j + 1)); done)
      --MACRLCs.[0].dl_max_mcs ${MAX_MCS:-27} --MACRLCs.[0].ul_max_mcs ${MAX_MCS:-27} --pdcp.drb.discard_timer ${DISCARD_TIMER:-ms300}
      --L1s.[0].prach_dtx_threshold ${PRACH_THRES:-450} --L1s.[0].prach_early_margin ${PRACH_EARLY:-6}
      --gNBs.[0].Xn_INTERFACE.gnb_ipv4_address_for_xnc $$IP $$XN_DIAL
      $$LOG $$OPT $$EXTRA

services:
  nr-ue:
    <<: *oai
    container_name: nr-ue
    cpuset: "0-3"
    working_dir: /build/run/nr-ue
    networks:
      core: {ipv4_address: 172.22.0.71}
    environment:
      <<: *env
      RFSIM: ${UE_RFSIM:-172.22.0.70}
      TRACE0: /oai-ran/tools/ntn/data/${SAT_TRACE1:-orbital_trace_s_300.csv}
      EXTRA: ${UE_EXTRA:-}
    command:
      - bash
      - -c
      - >-
        exec /build/nr-uesoftmodem -O $$CONF/nrue.uicc.ntn-leo.conf --rfsim --rfsimulator.[0].serveraddr $$RFSIM
        $$PROP_DELAY $$CHAN --channelmod.modellist_rfsimu_1.[0].sat_trace_file $$TRACE0 --position0.x -3310204.0 --position0.y -5006785.1 --position0.z 2157610.7
        --uicc0.imsi 001010000000001 --uicc0.key 465B5CE8B199B49FAA5F0A2EE238A6BC
        --uicc0.opc E8ED289DEBA952E4283B54E88E6183CA --uicc0.pdu_sessions.[0].dnn internet
        --time-sync-I 0.1 --ntn-initial-time-drift ${UE_DRIFT:--46} --initial-fo ${UE_FO:-56634} --cont-fo-comp ${UE_FO_COMP:-2} ${UE_GNSS:-} $$LOG $$OPT $$EXTRA

  ntn-gnb1:
    <<: *gnb
    container_name: ntn-gnb1
    cpuset: "4-7"
    working_dir: /build/run/ntn-gnb1
    networks:
      core: {ipv4_address: 172.22.0.70}
    environment:
      <<: *env
      IP: 172.22.0.70
      GNB_ID: "0xe00"
      CELL: 12345678
      PCI: ${GNB1_PCI:-0}
      SSB: ${GNB1_SSB:-1}
      ROOT: 1
      NEIGHBOURS: 0xe01/12345679/${GNB2_PCI:-1} ${GNB1_NEIGHBOURS:-}
      XN_DIAL: ""
      RFSIM: ${GNB1_RFSIM:-server}
      TRACE0: /oai-ran/tools/ntn/data/${SAT_TRACE1:-orbital_trace_s_300.csv}
      EXTRA: ${GNB1_EXTRA:-}

  ntn-gnb2:
    <<: *gnb
    container_name: ntn-gnb2
    cpuset: "8-11"
    working_dir: /build/run/ntn-gnb2
    networks:
      core: {ipv4_address: 172.22.0.72}
    environment:
      <<: *env
      IP: 172.22.0.72
      GNB_ID: "0xe01"
      CELL: 12345679
      PCI: ${GNB2_PCI:-1}
      SSB: ${GNB2_SSB:-2}
      ROOT: 40
      NEIGHBOURS: 0xe00/12345678/${GNB1_PCI:-0}
      XN_DIAL: --gNBs.[0].Xn_INTERFACE.candidate_gnb_ipv4_address_for_xnc.[0].ip 172.22.0.70
      RFSIM: ${GNB2_RFSIM:-172.22.0.71}
      TRACE0: /oai-ran/tools/ntn/data/${SAT_TRACE2:-orbital_trace_s_300.csv}
      EXTRA: ${GNB2_EXTRA:-}

  # third gNB (THREE_SAT=1), a second CHO candidate of gNB1
  ntn-gnb3:
    <<: *gnb
    container_name: ntn-gnb3
    cpuset: "12-15"
    working_dir: /build/run/ntn-gnb3
    networks:
      core: {ipv4_address: 172.22.0.73}
    environment:
      <<: *env
      IP: 172.22.0.73
      GNB_ID: "0xe02"
      CELL: 12345680
      PCI: 2
      SSB: 4
      ROOT: 80
      NEIGHBOURS: 0xe00/12345678/${GNB1_PCI:-0}
      XN_DIAL: --gNBs.[0].Xn_INTERFACE.candidate_gnb_ipv4_address_for_xnc.[0].ip 172.22.0.70
      RFSIM: 172.22.0.71
      TRACE0: /oai-ran/tools/ntn/data/${SAT_TRACE3:-orbital_trace_s_300.csv}
      EXTRA: ${GNB3_EXTRA:-}

networks:
  core:
    name: docker_open5gs_default
    external: true
