# LTE <-> NR NTN: one dual-mode UE container, one eNB and one NTN gNB (two with TWO_SAT), against the Open5GS core of core.sh
# (EPC and 5GC with the same subscriber). xrat.sh runs the LTE and NR UE processes in xr-ue one after the other: the
# applications and their sockets stay in the same network namespace across the RAT change, as on a real phone.
# rfsim: the LTE UE is the server of the eNB, the NR UE a client of ntn-gnb1 (ntn.sh link topology); each link's trace
# clock starts when the NR UE connects, as in ntn.sh link, so the SIB19 calibration of ntn.yaml holds. With TWO_SAT
# (xrat.sh) the NR UE is the server (port 4044) of ntn-gnb1 and ntn-gnb2, as in the CHO runs.
services:
  xr-ue:
    extends: {file: ntn.yaml, service: nr-ue}
    container_name: xr-ue
    working_dir: /tmp
    cpuset: ${UE_CPUS:-0-3}
    environment:
      LD_LIBRARY_PATH: /build:/build-lte
      LTE_PRB: ${LTE_PRB:-25}
      LTE_RXGAIN: ${LTE_RXGAIN:-140}
      LTE_UE_EXTRA: ${LTE_UE_EXTRA:-}
    networks:
      core: {ipv4_address: "${CORE_NET:-172.22}.0.61"}
    volumes:
      - ../../..:/oai-ran:ro
      - ${NR_BUILD:-../../../build}:/build:ro
      - ${LTE_BUILD:-../../../build-lte}:/build-lte:ro
    command: sleep infinity

  lte-enb1:
    extends: {file: lte.yaml, service: lte-enb1}
    working_dir: /tmp
    cpuset: ${ENB_CPUS:-4-7}
    environment:
      LD_LIBRARY_PATH: /build
    volumes:
      - ../../..:/oai-ran:ro
      - ${LTE_BUILD:-../../../build-lte}:/build:ro

  ntn-gnb1:
    extends: {file: ntn.yaml, service: ntn-gnb1}
    working_dir: /tmp
    cpuset: ${GNB1_CPUS:-4-7}
    environment:
      LD_LIBRARY_PATH: /build
    volumes:
      - ../../..:/oai-ran:ro
      - ${NR_BUILD:-../../../build}:/build:ro

  ntn-gnb2:
    extends: {file: ntn.yaml, service: ntn-gnb2}
    working_dir: /tmp
    cpuset: ${GNB2_CPUS:-8-11}
    environment:
      LD_LIBRARY_PATH: /build
    volumes:
      - ../../..:/oai-ran:ro
      - ${NR_BUILD:-../../../build}:/build:ro

networks:
  core:
    name: ${CORE_NETWORK:-docker_open5gs_default}
    external: true
